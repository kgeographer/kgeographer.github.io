<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Japan Loop Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --sea: #dde8ec;
    --land: #f4f5ef;
    --coast: #8fa5ae;
    --grid: #c5d5db;
    --ink: #18262d;
    --ink-2: #4b5e67;
    --ink-3: #6b7d86;
    --rule: #d3dde1;
    --panel: #ffffff;
    --halo: rgba(244, 245, 239, .82);
    --on-mark: #ffffff;
    --focus: #1b6f8a;
    --pa: #157a89;   /* north coast */
    --pb: #a5690f;   /* alps & festival */
    --pc: #964388;   /* nara & kii */
    --pd: #4658b8;   /* the way back */
    --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea: #14222a; --land: #26363d; --coast: #52717d; --grid: #1f313a;
      --ink: #e8eef0; --ink-2: #aebdc4; --ink-3: #8a9ea7; --rule: #2b3f48; --panel: #101c22;
      --halo: rgba(38, 54, 61, .85); --on-mark: #0d1a20; --focus: #7fd0e4;
      --pa: #4cc2d3; --pb: #e5a93f; --pc: #d78fca; --pd: #93a3f2;
    }
  }
  :root[data-theme="dark"] {
    --sea: #14222a; --land: #26363d; --coast: #52717d; --grid: #1f313a;
    --ink: #e8eef0; --ink-2: #aebdc4; --ink-3: #8a9ea7; --rule: #2b3f48; --panel: #101c22;
    --halo: rgba(38, 54, 61, .85); --on-mark: #0d1a20; --focus: #7fd0e4;
    --pa: #4cc2d3; --pb: #e5a93f; --pc: #d78fca; --pd: #93a3f2;
  }

  * { box-sizing: border-box; }
  html { background: var(--sea); }
  body {
    margin: 0; background: var(--sea); color: var(--ink);
    font: 400 15px/1.5 var(--font-body);
  }
  .page { max-width: 1240px; margin-inline: auto; padding-inline: 20px; padding-block: 28px 40px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 18px; }
  h1 { font: 800 clamp(28px, 4vw, 40px)/1.1 var(--font-display); margin: 0; letter-spacing: .01em; }
  h1 small { font: 400 .5em var(--font-body); color: var(--ink-3); margin-left: 10px; letter-spacing: 0; }
  .meta { font: 500 13px var(--font-mono); color: var(--ink-2); }

  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .mapwrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--sea); }
  svg.map { display: block; width: 100%; min-width: 620px; height: auto; }
  .graticule line { stroke: var(--grid); stroke-width: 1; }
  .graticule text { fill: var(--ink-3); font: 400 10px var(--font-mono); }
  .land { fill: var(--land); stroke: var(--coast); stroke-width: 1; stroke-linejoin: round; }
  .lake { fill: var(--sea); stroke: var(--coast); stroke-width: .8; }
  .seaname { fill: var(--ink-3); font: italic 400 12px var(--font-body); letter-spacing: .32em; text-transform: uppercase; opacity: .85; }

  .leg { fill: none; stroke-width: 2.6; stroke-linecap: round; opacity: .85; }
  .leg.ferry { stroke-dasharray: 2 6; stroke-width: 3; }
  .chev { opacity: .95; }
  .lbl { font: 700 12.5px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
  .lbl.transit { font: 400 10.5px var(--font-body); fill: var(--ink-2); }
  .transit-dot { fill: var(--land); stroke: var(--ink-2); stroke-width: 1.5; }

  .stop { cursor: pointer; outline: none; }
  .stop .disc { stroke: var(--land); stroke-width: 2; }
  .stop .num { fill: var(--on-mark); font: 700 11px var(--font-mono); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .stop .ring { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: 0; }
  .stop .anchor { fill: none; stroke-width: 1.6; stroke-dasharray: 3 3; }
  .stop:hover .ring, .stop:focus-visible .ring, .stop.on .ring { opacity: 1; }
  .stop:focus-visible .ring { stroke: var(--focus); stroke-width: 2.5; }

  .foot { margin: 10px 2px 0; font-size: 12px; color: var(--ink-2); max-width: 78ch; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 2px 0; font-size: 12.5px; color: var(--ink-2); }
  .key span { display: inline-flex; align-items: center; gap: 7px; }
  .key svg { width: 26px; height: 10px; overflow: visible; }

  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 0 0 10px; }
  .phase { margin: 0; padding: 14px 18px 6px; display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; border-top: 1px solid var(--rule); }
  .phase:first-child { border-top: 0; }
  .phase b { font: 800 15px var(--font-display); color: var(--c); }
  .phase i { font: 500 11.5px var(--font-mono); color: var(--ink-3); font-style: normal; }
  ol.stops { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 26px 1fr; gap: 0 12px; align-items: start; width: 100%; text-align: left;
         background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 7px 18px; }
  .row:hover, .row.on { background: color-mix(in srgb, var(--c) 10%, transparent); }
  .row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .badge { width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: var(--on-mark); font: 700 11.5px var(--font-mono);
           display: grid; place-items: center; margin-top: 1px; }
  .badge.nrt { border-radius: 4px; transform: rotate(45deg) scale(.72); }
  .badge.nrt span { transform: rotate(-45deg); font-size: 10px; }
  .head { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; }
  .nm { font-weight: 700; }
  .jp { font: 500 12.5px var(--font-body); color: var(--ink-3); }
  .dt { font: 500 12px var(--font-mono); color: var(--ink-2); margin-left: auto; }
  .stay { display: block; font-size: 13px; color: var(--ink-2); }
  .more { display: block; font-size: 13.5px; color: var(--ink); margin: 4px 0 2px; max-width: 60ch; }
  .more[hidden] { display: none; }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>Japan loop <small>日本</small></h1>
    <div class="meta">29 Sep – 21 Oct 2026 · Narita to Narita, counterclockwise · 16 stops</div>
  </header>

  <div class="layout">
    <div>
      <div class="mapwrap">
        <svg class="map" id="map" viewBox="0 0 780 700" role="img" aria-label="Map of the Japan road loop from Narita north to Sado, across to Takayama, south to Nara and Kii, then back to Narita"></svg>
      </div>
      <div class="key" aria-hidden="true">
        <span><svg viewBox="0 0 26 10"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--ink-2)" stroke-width="2.6" stroke-linecap="round"/></svg>drive</span>
        <span><svg viewBox="0 0 26 10"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--ink-2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/></svg>car ferry</span>
        <span><svg viewBox="0 0 26 10"><circle cx="13" cy="5" r="4.5" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-dasharray="3 3"/></svg>festival anchor</span>
      </div>
      <p class="foot">Stops sit on the town centre; legs are straight lines between stops, not roads. Coastline and Lake Biwa: Natural Earth (public domain).</p>
    </div>
    <aside class="panel" id="panel" aria-label="Stops in order"></aside>
  </div>
</div>

  });

  // side panel: stops grouped by phase, each expandable
  var panel = document.getElementById("panel"), rows = {}, list = null;
  function heading(html, c) {
    var h = document.createElement("h2");
    h.className = "phase"; h.style.setProperty("--c", c); h.innerHTML = html;
    panel.appendChild(h);
    list = document.createElement("ol"); list.className = "stops"; panel.appendChild(list);
  }
  var lastPh = null;
  STOPS.forEach(function (s) {
    if (s.kind === "air") heading("<b>Start &amp; finish</b><i>29 Sep · 21 Oct</i>", col("a"));
    else if (s.ph !== lastPh) { lastPh = s.ph; heading("<b>" + PHASES[s.ph].name + "</b><i>" + PHASES[s.ph].span + "</i>", col(s.ph)); }
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "row"; b.style.setProperty("--c", col(s.ph)); b.setAttribute("aria-expanded", "false");
    b.innerHTML = '<span class="badge' + (s.kind === "air" ? " nrt" : "") + '"><span>' + (s.kind === "air" ? "✈" : s.n) + '</span></span>' +
      '<span><span class="head"><span class="nm">' + s.name + '</span><span class="jp">' + s.jp + '</span><span class="dt">' + s.dates + '</span></span>' +
      '<span class="stay">' + s.stay + '</span><span class="more" hidden></span></span>';
    b.querySelector(".more").textContent = s.note;
    li.appendChild(b); list.appendChild(li);
    rows[s.id] = { b: b, more: b.querySelector(".more") };
    b.addEventListener("click", function () { select(s.id, false); });
  });

  var current = null;
  function select(id, scroll) {
    var same = current === id;
    if (current) {
      nodes[current].classList.remove("on");
      rows[current].b.classList.remove("on"); rows[current].b.setAttribute("aria-expanded", "false"); rows[current].more.hidden = true;
      current = null;
    }
    if (same && !scroll) return;
    current = id;
    nodes[id].classList.add("on");
    rows[id].b.classList.add("on"); rows[id].b.setAttribute("aria-expanded", "true"); rows[id].more.hidden = false;
    if (scroll) rows[id].b.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  select("takayama", false);
})();
</script>
</body>
</html>
